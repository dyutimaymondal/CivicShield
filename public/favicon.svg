<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="csBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e1f38" />
      <stop offset="100%" stop-color="#050a14" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="csShieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Core Emblem Gradient -->
    <linearGradient id="csCoreGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#csBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#csShieldBorder)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Cyber Shield Contour -->
  <path
    d="M32 8L50 16.5V31C50 42.5 42.5 50.5 32 55C21.5 50.5 14 42.5 14 31V16.5L32 8Z"
    fill="#0a1424"
    stroke="url(#csShieldBorder)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Inner Dynamic Shield Geometry -->
  <path
    d="M32 14L44 19.8V31C44 39.5 38.8 45.8 32 49.5C25.2 45.8 20 39.5 20 31V19.8L32 14Z"
    fill="url(#csCoreGrad)"
    fill-opacity="0.15"
    stroke="url(#csShieldBorder)"
    stroke-width="1.2"
    stroke-dasharray="2 2"
  />

  <!-- Central Verified Core Symbol -->
  <path
    d="M26 31.5L30.2 36L38.5 25"
    stroke="#22d3ee"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#csGlow)"
  />

  <!-- Top Neural Beacon Dot -->
  <circle cx="32" cy="19" r="2.2" fill="#34d399" filter="url(#csGlow)" />
</svg>